# Keeps the pins of check.yml moving through reviewed pull requests
# (as bridge does, bats-lang/bridge#174). Dependabot's github-actions
# ecosystem updates an action pinned by commit together with its
# "# vX.Y.Z" comment; the npm entry updates tests/dynamic's exact
# version and package-lock.json.
#
# Not here: the shared workflows of bats-lang/repository-prototype (the
# daily relock.yml moves those by commit), the bats setup action of
# bats-lang/bats (ignored below, moved by hand) and the runner label
# (moved by hand). Node's version is .nvmrc, which check.yml reads
# (node-version-file). Dependabot updates only "a dependency manifest or
# lock file for one of the supported package managers" (its supported
# ecosystems page), and .nvmrc is neither, so Dependabot does not move it.
# Renovate's nvm manager does (its default pattern is .nvmrc), once the
# Renovate app is installed (bats-lang/repository-prototype#369, human
# only); the decision is repository-prototype#367, comment 6285091040.
# By hand until then.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # a release is a week old before it is proposed, so a compromised one
    # can be noticed first
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: bats-lang/*
  - package-ecosystem: npm
    directory: /tests/dynamic
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
